version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5

  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "07:10"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /functions
    schedule:
      interval: weekly
      day: monday
      time: "07:20"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /scripts/smoke
    schedule:
      interval: weekly
      day: monday
      time: "07:30"
      timezone: Europe/Istanbul
    open-pull-requests-limit: 5
