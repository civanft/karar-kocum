name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: bash scripts/check_layers.sh
      - run: flutter test --coverage
      # Kapsam kapısı — TEKNIK-MIMARI.md §10. %80 altı = pipeline KIRMIZI.
      - run: bash scripts/check_coverage.sh 80
      - name: Kapsam raporunu artefakt olarak sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Firestore rules testleri (emulator, Y-5 negatif senaryolar dahil)
        working-directory: ${{ github.workspace }}
        run: >
          npx --yes firebase-tools emulators:exec --only firestore
          --project demo-karar
          "cd functions && npx vitest run --config vitest.rules.config.ts"
