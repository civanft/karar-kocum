name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scripts/smoke/package-lock.json
      - name: Git geçmişinde secret taraması
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke bağımlılık kurulumu
        run: npm ci --prefix scripts/smoke
      - name: Smoke bağımlılık güvenlik denetimi
        run: npm audit --prefix scripts/smoke --audit-level=moderate
      - name: Smoke config birim testleri
        run: npm test --prefix scripts/smoke

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: bash scripts/check_layers.sh
      - run: flutter test --coverage
      # Kapsam kapısı — TEKNIK-MIMARI.md §10. %80 altı = pipeline KIRMIZI.
      - run: bash scripts/check_coverage.sh 80
      - name: Kapsam raporunu artefakt olarak sakla
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Firestore rules testleri (emulator, Y-5 negatif senaryolar dahil)
        run: npm run test:rules
      - name: Hesap silme privacy testleri (Auth + Firestore emulator)
        run: npm run test:privacy
