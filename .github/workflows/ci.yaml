name: CI

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Public repository file and credential guard
        run: |
          python3 scripts/test_publication_guard.py
          python3 scripts/check_publication.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/smoke/package-lock.json
      - name: Git geçmişinde secret taraması
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke bağımlılık kurulumu
        run: npm ci --prefix scripts/smoke
      - name: Smoke bağımlılık güvenlik denetimi
        run: npm audit --prefix scripts/smoke --audit-level=moderate
      - name: Smoke config birim testleri
        run: npm test --prefix scripts/smoke

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: 3.44.5
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: bash scripts/check_layers.sh
      - run: flutter test --coverage
      # Kapsam kapısı — TEKNIK-MIMARI.md §10. %80 altı = pipeline KIRMIZI.
      - run: bash scripts/check_coverage.sh 80
      - name: Kapsam raporunu artefakt olarak sakla
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run build
      - name: Test sözleşmesi tip denetimi (sahte portlar src ile uyumlu mu)
        run: npm run typecheck
      - run: npm test
      - name: Firestore rules testleri (emulator, Y-5 negatif senaryolar dahil)
        run: npm run test:rules
      - name: Hesap silme privacy testleri (Auth + Firestore emulator)
        run: npm run test:privacy
      - name: Analiz journal idempotency testleri (Firestore emulator)
        run: npm run test:emulator

  codeql:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:javascript-typescript
