name: CI

permissions:
  contents: read
  pull-requests: read

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1'

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Public repository file and credential guard
        run: |
          python3 scripts/test_publication_guard.py
          python3 scripts/check_publication.py
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: scripts/smoke/package-lock.json
      - name: Git geçmişinde secret taraması
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$(mktemp -d)"
          trap 'rm -rf -- "$scanner_dir"' EXIT
          curl --fail --silent --show-error --location --retry 3 \
            --output "$scanner_dir/gitleaks.tar.gz" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check --status
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git . --log-opts="--all --full-history" --redact=100 --no-banner
      - name: Smoke bağımlılık kurulumu
        run: npm ci --prefix scripts/smoke
      - name: Smoke bağımlılık güvenlik denetimi
        run: npm audit --prefix scripts/smoke --audit-level=moderate
      - name: Smoke config birim testleri
        run: npm test --prefix scripts/smoke

  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Flutter sürümünün TEK KAYNAĞI `.flutter-version` dosyasıdır.
      # İkinci bir sabit tutmak, birinin güncellenip diğerinin unutulduğu
      # sessiz sürüm kaymasına yol açıyordu; `test/release/toolchain_pin_test.dart`
      # workflow'da ikinci bir Flutter sürümü kalmadığını zorlar.
      - name: Flutter sürümünü repodan oku
        id: flutter_version
        run: |
          set -euo pipefail
          if [ ! -f .flutter-version ]; then
            echo "::error::.flutter-version bulunamadı"; exit 1
          fi
          version="$(tr -d '[:space:]' < .flutter-version)"
          # FAIL-CLOSED: boş ya da beklenmeyen biçim derlemeyi durdurur.
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::.flutter-version geçersiz veya boş"; exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Flutter SDK sürümü (.flutter-version): $version"

      # subosito/flutter-action KULLANILMAZ: `action.yml`'i etiketle
      # pinlenmiş bir `actions/cache@v5` referansı taşıyor ve deponun
      # `sha_pinning_required` politikası bunu reddediyor — iş girdiler
      # değerlendirilmeden, "Set up job" aşamasında düşüyordu (`cache: false`
      # da çare değil). Politikayı GEVŞETMEK yerine SDK doğrudan kurulur:
      # tedarik zincirinden bir üçüncü taraf aksiyon tamamen kalkar.
      #
      # DÜRÜST SINIR: `--branch <tag>` tam commit değişmezliği SAĞLAMAZ —
      # bir etiket yeniden işaretlenebilir. Tedarik zinciri sertleştirmesi
      # (SDK checksum/mirror) ayrı bir iştir; bkz. docs/RELEASE-RUNBOOK.md.
      - name: Flutter SDK kurulumu
        run: |
          git clone --depth 1 --branch "${{ steps.flutter_version.outputs.version }}" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/flutter/bin/cache/dart-sdk/bin" >> "$GITHUB_PATH"
      - run: flutter --version
      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --fatal-infos
      - run: bash scripts/check_layers.sh
      - run: flutter test --coverage
      # Kapsam kapısı — TEKNIK-MIMARI.md §10. %80 altı = pipeline KIRMIZI.
      - run: bash scripts/check_coverage.sh 80
      - name: Kapsam raporunu artefakt olarak sakla
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  functions:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npm run lint
      - run: npm run build
      - name: Test sözleşmesi tip denetimi (sahte portlar src ile uyumlu mu)
        run: npm run typecheck
      - run: npm test
      - name: Firestore rules testleri (emulator, Y-5 negatif senaryolar dahil)
        run: npm run test:rules
      - name: Hesap silme privacy testleri (Auth + Firestore emulator)
        run: npm run test:privacy
      - name: Analiz journal idempotency testleri (Firestore emulator)
        run: npm run test:emulator

  codeql:
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          category: /language:javascript-typescript
