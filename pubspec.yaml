name: karar_veriyorum
description: AI destekli karar asistanı — önemli kararlarını dakikalar içinde yapılandır, puanla ve tarafsız analiz al.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^14.2.0

  # Modeller
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  cloud_functions: ^5.0.4
  firebase_crashlytics: ^4.0.4
  firebase_app_check: ^0.3.0

  # Yerel bildirim (Sprint C.1 — takip sözü; Firebase/FCM KULLANILMAZ)
  flutter_local_notifications: ^18.0.1
  timezone: ^0.9.4

  # Yerel depolama / yardımcılar
  shared_preferences: ^2.2.3
  intl: ^0.20.2

  # Yasal sayfaları harici tarayıcıda açar (PR-LEGAL-1)
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code-gen
  build_runner: ^2.4.11
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  # riverpod_generator + custom_lint + riverpod_lint: analyzer 7.6 ile uyumsuz
  # (build_runner'ı kırıyor). Sprint 1 codegen'siz düz provider kullanıyor;
  # toolchain güncellenince yeniden değerlendirilecek (bkz. Sprint 1 raporu).

  # Test
  mocktail: ^1.0.4
  fake_cloud_firestore: ^3.0.2
  firebase_auth_mocks: ^0.14.1
  mock_exceptions: ^0.8.2
  golden_toolkit: ^0.15.0

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true # l10n

  assets:
    - assets/images/
    - assets/icons/
